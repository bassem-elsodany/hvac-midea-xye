name: Release

on:
  workflow_dispatch:  # manual trigger only — re-enable push after setting repo permissions

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    name: Release Please
    steps:
      - uses: googleapis/release-please-action@v4.2.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
