# One file per ESP. Copy to HA /config/esphome/, edit substitutions block + api secret line.

substitutions:
  # ════════════════════════════════════════
  # PER-ROOM — change these when copying
  # ════════════════════════════════════════
  name: "hvac-living-controller"          # ESP hostname (must be unique per device)
  friendly_name: "Living HVAC Controller" # HA device/entity display name
  comment: "ESPHome ESP32 RS-485 — living room ducted heat pump"
  room_id: "living"                       # Short slug: used in sensor IDs + fallback AP SSID
  ip_address: "10.0.20.160"              # Static IP (must be unique per device)
  follow_me_entity: "sensor.zigbee_temp_living_temperature"  # Zigbee room temp sensor in HA
  climate_name: "hvac-living-controller"
  climate_name_id: "hvac_living_controller"
  temp_min: "20"                          # HA UI lower limit °C (visual only, not bus encoded)
  temp_max: "26"                          # HA UI upper limit °C

  # ════════════════════════════════════════
  # SHARED — same on every ESP (rarely change)
  # ════════════════════════════════════════
  wifi_gateway: "10.0.20.1"
  wifi_subnet: "255.255.255.0"
  uart_tx: "GPIO17"                       # RS-485 DI → ESP TX
  uart_rx: "GPIO16"                       # RS-485 RO → ESP RX
  unit_id: "0x00"                         # XYE indoor unit ID (0x00 = single unit default)
  master_id: "0x00"                       # XYE master/controller ID advertised by this ESP
  midea_xye_log: "DEBUG"                  # "DEBUG" commissioning | "INFO" production

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  comment: ${comment}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0
  logs:
    midea_xye: ${midea_xye_log}

api:
  encryption:
    key: !secret hvac_living__encryption_key   # change secret name per room in secrets.yaml

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${ip_address}
  manual_ip:
    static_ip: ${ip_address}
    gateway: ${wifi_gateway}
    subnet: ${wifi_subnet}
  ap:
    ssid: "hvac-${room_id}-setup"
    password: !secret access_point_password

captive_portal:

web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

external_components:
  - source:
      type: git
      url: https://github.com/bassem-elsodany/hvac-midea-xye
      ref: main
    refresh: always
    components: [midea_xye]

uart:
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  baud_rate: 4800
  # Uncomment for commissioning / bus debugging, comment out for production:
  debug:
    direction: BOTH

sensor:
  - platform: homeassistant
    id: ${room_id}_follow_me
    entity_id: ${follow_me_entity}
    name: "${friendly_name} Follow-Me"
  - platform: wifi_signal
    name: "${friendly_name} Wi-Fi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    id: uptime_sec
    internal: true
  - platform: template
    name: "${friendly_name} Uptime Days"
    lambda: |-
      return (id(uptime_sec).state/60)/60/24;
    icon: mdi:clock-start
    unit_of_measurement: days
    update_interval: 60s

climate:
  - platform: midea_xye
    name: ${climate_name}
    id: ${climate_name_id}
    unit_id: ${unit_id}
    master_id: ${master_id}
    period: 1s
    timeout: 100ms
    use_fahrenheit: false
    beeper: true
    compressor_aware_action: true
    # C4 path — unit returns 0xC5 (not supported), keep false
    sync_fan_mode_from_device: false
    # C0 path — sync HA fan_mode from physical running speed; fixes AUTO-vs-MEDIUM divergence
    sync_fan_mode_from_c0: true
    visual:
      min_temperature: ${temp_min} °C
      max_temperature: ${temp_max} °C
      temperature_step: 1.0 °C
    supported_modes:
      - FAN_ONLY
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
    follow_me_sensor: ${room_id}_follow_me
    internal_current_temperature:
      name: "C0 T1 Room Temp"
    bus_target_temperature:
      name: "C0 Bus Setpoint"
    bus_operation_mode:
      name: "C0 Operation Mode Raw"
    bus_operation_mode_text:
      name: "C0 Operation Mode"
    bus_fan_mode:
      name: "C0 Fan Mode Raw"
    bus_fan_mode_text:
      name: "C0 Fan Mode"
    capabilities:
      name: "C0 Capabilities Raw"
    capabilities_text:
      name: "C0 Capabilities"
    mode_flags:
      name: "C0 Mode Flags"
    operation_flags:
      name: "C0 Operation Flags"
    temperature_2a:
      name: "C0 T2A Coil Inlet"
    temperature_2b:
      name: "C0 T2B Coil Outlet"
    temperature_3:
      name: "C0 T3 Outdoor Coil"
    timer_start:
      name: "C0 Timer Start"
    timer_stop:
      name: "C0 Timer Stop"
    error_flags:
      name: "C0 Error Flags"
    protect_flags:
      name: "C0 Protect Flags"
    ccm_error_flags:
      name: "C0 CCM Error Flags"
    fan_speed:
      name: "C0 Fan Speed Level"
    unknown1:
      name: "C0 Unknown1"
    unknown2:
      name: "C0 Unknown2"
    unknown4:
      name: "C0 Unknown4"
    unknown5:
      name: "C0 Unknown5"
    unknown6:
      name: "C0 Unknown6"
    defrost:
      name: "C0 Defrost Active"
    compressor_active:
      name: "C0 Compressor Run Flag"

switch:
  - platform: template
    name: "RS485 Active"
    id: rs485_active
    optimistic: true
    internal: true
    restore_mode: ALWAYS_ON